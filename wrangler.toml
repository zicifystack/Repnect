name = "repnect"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# SvelteKit Cloudflare adapter output directory
pages_build_output_dir = ".svelte-kit/cloudflare"

# Drizzle migration output — used by `wrangler d1 migrations apply`
migrations_dir = "./drizzle"

[[d1_databases]]
binding = "DB"
database_name = "repnect-db"
database_id = "YOUR_D1_DATABASE_ID"
# ── Setup steps ────────────────────────────────────────────────────────────
# 1. Create the remote D1 database:
#      wrangler d1 create repnect-db
# 2. Copy the returned database_id above.
# 3. Run migrations locally (dev):
#      wrangler d1 migrations apply repnect-db --local
#    Or remotely (production):
#      wrangler d1 migrations apply repnect-db --remote

[vars]
# Public runtime vars — set sensitive values via:
#   wrangler secret put BETTER_AUTH_SECRET
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GITHUB_CLIENT_ID
#   wrangler secret put GITHUB_CLIENT_SECRET
